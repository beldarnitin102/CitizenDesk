  <script>
    const notice = document.getElementById("notice");
    let noticeTimer;

    function showNotice() {
      notice.classList.add("is-visible");
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => notice.classList.remove("is-visible"), 3200);
    }

    document.getElementById("register-button").addEventListener("click", showNotice);
    document.getElementById("track-button").addEventListener("click", showNotice);
    document.getElementById("login-button").addEventListener("click", showNotice);
    document.getElementById("language-select").addEventListener("change", showNotice);

    lucide.createIcons();
  </script>
