  <script src="/_sdk/b7bbbe551ba4f8f5.editing_sdk.js" integrity="sha512-h06pMz6KcVo4Wjvoggb4sS5DZpb55bTriAzBmA0YwbkBA3z2ZXl8CBEbCWT+/fAsm0SwDejJ7jJHOZsLZKqPoQ=="></script>
  <script>
    const notice = document.getElementById("notice");
    let noticeTimer;

    function showNotice() {
      notice.classList.add("is-visible");
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => notice.classList.remove("is-visible"), 3200);
    }

    ["register-button", "track-button", "login-button", "all-departments-button", "tracker-button", "support-button"].forEach(id => {
      document.getElementById(id).addEventListener("click", showNotice);
    });
    document.querySelectorAll(".department-action, .track-case").forEach(button => button.addEventListener("click", showNotice));
    document.getElementById("language-select").addEventListener("change", showNotice);

    document.querySelectorAll(".faq-toggle").forEach(button => {
      button.addEventListener("click", () => {
        const item = button.closest(".faq-item");
        const opened = item.classList.toggle("is-open");
        button.setAttribute("aria-expanded", String(opened));
      });
    });

    const menuButton = document.getElementById("menu-button");
    const mobileNav = document.getElementById("mobile-nav");
    menuButton.addEventListener("click", () => {
      const opened = mobileNav.classList.toggle("is-open");
      menuButton.setAttribute("aria-expanded", String(opened));
    });
    document.querySelectorAll("#mobile-nav a").forEach(link => link.addEventListener("click", () => {
      mobileNav.classList.remove("is-open");
      menuButton.setAttribute("aria-expanded", "false");
    }));

    lucide.createIcons();
  </script>
